[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wattslot"
description = "Planification énergétique domestique pour Home Assistant (v2)."
version = "0.9.7"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "highspy==1.15.1",  # moteur du calcul (décision 11), roues amd64 et arm64
    "mcp==2.3.0",  # serveur MCP pour l'Assist de HA (lot 6.1), SDK officiel
    "pyoxigraph==0.5.13",
    "tzdata==2026.6",  # fuseaux horaires : l'image Python « slim » n'en a pas
    "uvicorn[standard]==0.54.0",
    "websockets==17.4",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.16.0",
    "mypy==2.4.1",
    "pyshacl==0.40.2",  # formes SHACL vérifiées en CI (lot 2b.4), jamais dans l'image
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wattslot = [
    "ontology/*.ttl",
    "ontology/library/*.ttl",
    "profiles/*.json",
    "templates/*.json",
    "planning/locales/*.json",
    "planning/locales/warnings/*.json",
    "assistant/prompts/*.txt",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pyoxigraph"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

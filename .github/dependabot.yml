# Mises à jour des dépendances : une PR groupée par écosystème et par semaine, pour garder la
# revue légère. Les versions majeures de Python et de l'interface restent hors du groupe : chacune
# a sa propre PR, pour qu'une seule incompatible ne bloque pas toutes les autres.
# Les actions des workflows sont épinglées par commit (version en commentaire) : Dependabot met
# à jour le commit et le commentaire ensemble.
#
# Les PRs de Dependabot n'ont pas les secrets du dépôt : le contrôle des données personnelles y
# tourne avec les règles génériques seulement, comme pour une PR d'un fork (v2.yml).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "CI"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /app/backend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "Serveur"
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /app/frontend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "Interface"
    # TypeScript 7 : typescript-eslint 8 n'accepte que TypeScript < 6.1 (dépendance pair), npm ci
    # échoue. À retirer quand typescript-eslint le prendra en charge.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /app
    # Changer de version de Python ou de Node dans l'image mérite sa propre PR (dépendances à
    # revérifier) : ici, seulement Python 3.12.x et Node 22.x.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "Image"
    groups:
      images:
        patterns: ["*"]

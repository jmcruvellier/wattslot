name: Idea or request
description: Suggest an improvement or a new feature.
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like WattSlot to do?
      description: Describe your need and your home (tariff, solar, battery, appliances), in English or French.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?

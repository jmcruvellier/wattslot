# Statistiques de téléchargement de WattSlot, relevées chaque nuit (lot statistiques de
# diffusion). Le script `dev/tools/download_stats.py` relève les téléchargements de l'image
# `ghcr.io/jmcruvellier/wattslot` (total et par version, lus sur la page publique du paquet :
# c'est elle que tirent l'extension Home Assistant et Docker), ceux des assets des releases
# (l'API GitHub, aucun asset pour l'instant) et, avec un jeton, les clones du dépôt sur 14
# jours (Home Assistant clone le dépôt de l'extension quand on l'ajoute).
#
# Le résultat est déposé sur la branche `stats` (jamais sur `main`, protégée) :
# - `dev/stats/downloads.json` : snapshot de la dernière exécution ;
# - `dev/stats/history.jsonl` : une ligne par jour, pour garder l'historique au-delà des 14
#   jours de l'API traffic.
#
# Le `GITHUB_TOKEN` de la CI suffit pour les releases (API publique) ; pour les clones, si
# l'API traffic le refuse, poser un PAT avec scope `repo` (ou permission « Traffic ») dans le
# secret `STATS_PAT` — il est préféré au `GITHUB_TOKEN` quand il existe.
name: Stats de téléchargement

on:
  schedule:
    # Tous les jours vers 04:17 UTC. GitHub décale volontiers les tâches planifiées (jusqu'à
    # plusieurs heures à l'heure pile, quand tous les dépôts lancent les leurs) : une minute
    # moins demandée limite le retard.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write # branche stats

jobs:
  stats:
    name: Relevé quotidien
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Branche stats
        # Le script vient de main : sur la branche stats ne reste que la copie de sa création.
        run: |
          cp dev/tools/download_stats.py "$RUNNER_TEMP/"
          git fetch origin stats || true
          git checkout stats 2>/dev/null || git checkout -b stats

      - name: Collecte
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_PAT || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dev/stats
          python "$RUNNER_TEMP/download_stats.py" --json --clones --history dev/stats/history.jsonl \
            > dev/stats/downloads.json

      - name: Publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/stats/
          git diff --cached --quiet || git commit -m "Stats de téléchargement $(date -u +%Y-%m-%d)"
          git push origin stats
